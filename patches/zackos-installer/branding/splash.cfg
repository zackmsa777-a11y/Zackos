# QEMU's legacy VMware SVGA II has no pitch lock for vmwgfx. Keep firmware KMS.
set zack_video=
if smbios --type 1 --get-string 4 --set=zack_vendor; then
    if [ "$zack_vendor" = QEMU ]; then
        setpci -d 15ad:0405 -v zack_svga DEVICE_ID
        if [ "$zack_svga" = 405 ]; then
            set zack_video=nomodeset
        fi
    fi
fi
export zack_video

set timeout_style=menu
if loadfont /boot/grub/fonts/unicode.pf2; then
    set gfxmode=1024x768,800x600,auto
    insmod all_video
    insmod gfxterm
    if terminal_output gfxterm; then
        insmod png
        insmod gfxmenu
        set theme=/boot/grub/zackos/theme.txt
        export theme
    fi
fi
if serial --unit=0 --speed=115200; then
    terminal_input --append serial
    terminal_output --append serial
fi
