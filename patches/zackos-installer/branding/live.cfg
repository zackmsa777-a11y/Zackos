set timeout=5
set default=live
if search --no-floppy --file --set=zackdisk /boot/grub/zackos-first-user; then
    # A successful installation on a single new disk can finish the handoff
    # even on firmware which continues booting the inserted USB or DVD.
    export zackdisk
    menuentry "Continue into installed ZackOS" --id=installed {
        set root=$zackdisk
        configfile /boot/grub/grub.cfg
    }
    set default=installed
fi
source /boot/grub/splash.cfg

if [ -f /desktop.img ]; then
    menuentry "Try or install ZackOS" --id=live {
        set gfxpayload=keep
        linux /boot/vmlinuz $zack_video quiet loglevel=3 zackos.live=1 zackos.desktop=1 console=ttyS0,115200 console=tty0
        initrd /boot/initramfs.img
    }
    set console_id=console
else
    set console_id=live
fi
menuentry "Text installer" --id=$console_id {
    set gfxpayload=text
    linux /boot/vmlinuz nomodeset quiet loglevel=3 zackos.live=1 console=ttyS0,115200 console=tty0
    initrd /boot/initramfs.img
}
menuentry "Installer compatibility mode" --id=compat {
    set gfxpayload=text
    linux /boot/vmlinuz nomodeset zackos.live=1 console=ttyS0,115200 console=tty0 pci=noacpi noapic
    initrd /boot/initramfs.img
}
