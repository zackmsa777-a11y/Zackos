# ZackOS i3 config - adapted from github.com/TxGVNN/i3-config
set $mod Mod4

font pango:DejaVu Sans Mono 10
floating_modifier $mod
focus_follows_mouse no
set $ink #10191c
set $mint #8ed3b9
set $lime #d8ff62
set $cream #f4f4df
set $slate #32474a
set $coral #ff977a
default_border pixel 2
default_floating_border pixel 2
gaps inner 12
gaps outer 5
client.focused          $mint  $mint  $ink   $lime  $mint
client.focused_inactive $slate $slate $cream $slate $slate
client.unfocused        $slate $ink   $mint  $slate $slate
client.urgent           $coral $coral $ink   $coral $coral
client.background       $ink
exec_always --no-startup-id feh --no-fehbg --bg-fill /usr/share/backgrounds/zackos/orbit.png

# terminal / launcher
bindsym $mod+Return exec xterm
bindsym $mod+b exec firefox
bindsym $mod+F2 exec thunar
set $launcher dmenu_run -i -p Launch -nb '#10191c' -nf '#f4f4df' -sb '#d8ff62' -sf '#10191c'
bindsym $mod+d exec --no-startup-id $launcher
bindsym $mod+Shift+d exec --no-startup-id $launcher
bindsym $mod+Shift+q kill
bindsym $mod+x border toggle

# focus (vim-style + arrows)
bindsym $mod+j focus left
bindsym $mod+k focus down
bindsym $mod+l focus up
bindsym $mod+semicolon focus right
bindsym $mod+Left focus left
bindsym $mod+Down focus down
bindsym $mod+Up focus up
bindsym $mod+Right focus right

# move
bindsym $mod+Shift+j move left
bindsym $mod+Shift+k move down
bindsym $mod+Shift+l move up
bindsym $mod+Shift+semicolon move right

# layout
bindsym $mod+h split h
bindsym $mod+v split v
bindsym $mod+f fullscreen toggle
bindsym $mod+s layout stacking
bindsym $mod+w layout tabbed
bindsym $mod+e layout toggle split
bindsym $mod+Shift+space floating toggle
bindsym $mod+space focus mode_toggle
bindsym $mod+a focus parent

# workspaces
set $ws1 "1:desk"
set $ws2 "2:web"
set $ws3 "3:code"
set $ws4 "4:files"
set $ws5 "5:media"
bindsym $mod+1 workspace number $ws1
bindsym $mod+2 workspace number $ws2
bindsym $mod+3 workspace number $ws3
bindsym $mod+4 workspace number $ws4
bindsym $mod+5 workspace number $ws5
bindsym $mod+Shift+1 move container to workspace number $ws1
bindsym $mod+Shift+2 move container to workspace number $ws2
bindsym $mod+Shift+3 move container to workspace number $ws3
bindsym $mod+Shift+4 move container to workspace number $ws4
bindsym $mod+Shift+5 move container to workspace number $ws5

# resize mode
mode "resize" {
    bindsym j resize shrink width 5 px or 5 ppt
    bindsym k resize grow height 5 px or 5 ppt
    bindsym l resize shrink height 5 px or 5 ppt
    bindsym semicolon resize grow width 5 px or 5 ppt
    bindsym Return mode "default"
    bindsym Escape mode "default"
}
bindsym $mod+r mode "resize"

# power menu - routed through our own runit-safe wrappers, no systemd
mode "(l)ock (r)eboot (p)oweroff (e)xit-i3" {
    bindsym l exec i3lock -c 10191c, mode "default"
    bindsym r exec /sbin/reboot
    bindsym p exec /sbin/poweroff
    bindsym e exec i3-msg exit
    bindsym Return mode "default"
    bindsym Escape mode "default"
}
bindsym $mod+Shift+e mode "(l)ock (r)eboot (p)oweroff (e)xit-i3"

bindsym $mod+Shift+c reload
bindsym $mod+Shift+r restart

bar {
    i3bar_command i3bar
    position top
    height 32
    strip_workspace_numbers yes
    workspace_min_width 60
    separator_symbol " · "
    status_command i3status -c /etc/zackos/i3status.conf
    colors {
        background $ink
        statusline $cream
        separator $slate
        focused_workspace $lime $lime $ink
        active_workspace $slate $slate $cream
        inactive_workspace $ink $ink $mint
        urgent_workspace $coral $coral $ink
        binding_mode $mint $mint $ink
    }
    font pango:DejaVu Sans Mono 10
}
