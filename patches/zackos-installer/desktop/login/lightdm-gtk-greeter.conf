[greeter]
background=/usr/share/backgrounds/zackos/sign-in.png
user-background=false
theme-name=Adwaita-dark
icon-theme-name=Adwaita
font-name=Inter 11
xft-antialias=true
xft-dpi=96
hide-user-image=false
default-user-image=/usr/share/pixmaps/zackos-avatar.png
position=8%,start 57%,center
indicators=~spacer;~clock;~a11y
clock-format=%a  %d %b    %H:%M
