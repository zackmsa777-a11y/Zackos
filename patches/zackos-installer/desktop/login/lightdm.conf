[LightDM]
greeter-user=lightdm
run-directory=/run/lightdm
greeters-directory=/nix/var/nix/profiles/default/share/xgreeters
sessions-directory=/usr/share/xsessions
minimum-vt=7

[Seat:*]
xserver-command=/nix/var/nix/profiles/default/bin/Xorg -nolisten tcp
greeter-session=lightdm-gtk-greeter
greeter-wrapper=/etc/lightdm/zackos-greeter
greeter-hide-users=false
greeter-show-manual-login=false
allow-guest=false
user-session=zackos-i3
session-wrapper=/etc/X11/zackos-session
