general {
    output_format = "i3bar"
    colors = true
    color_good = "#8ed3b9"
    color_degraded = "#e7bd82"
    color_bad = "#ff977a"
    interval = 3
    separator = "   ·   "
}
order += "cpu_usage"
order += "memory"
order += "tztime local"

cpu_usage {
    format = "CPU  %usage"
}
memory {
    format = "MEM  %used"
    format_degraded = "MEM  %used"
    memory_used_method = "memavailable"
}
tztime local {
    format = "%a %d %b   %H:%M"
}
